spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/logistica}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# URL del componente de Donaciones
urls.donaciones=https://marco-maggio-springboot-api-entrega2-dsi.onrender.com
# URL del componente de Donadores
urls.donadores=https://donadores-y-entidades-0uv4.onrender.com

# Envíos de métricas cada 100 segundos
management.datadog.metrics.export.step=100s

# La API Key se pasa por variable de entorno para seguridad
management.datadog.metrics.export.api-key=${DATADOG_LOGGER_API_KEY}
management.datadog.logs.site=us5.datadoghq.com
datadog.logs.api-key=${DATADOG_LOGGER_API_KEY}
management.datadog.metrics.export.uri=https://api.us5.datadoghq.com

# Etiquetas globales para identificar el componente
management.metrics.tags.application=logistica-component
management.metrics.tags.env=dev

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=true

# Configuración de puerto
server.port=${PORT:8080}

# Habilitar reintentos en el consumidor de RabbitMQ
spring.rabbitmq.listener.simple.retry.enabled=true
# Espera entre cada intento
spring.rabbitmq.listener.simple.retry.initial-interval=2000
# Intentos  maximos
spring.rabbitmq.listener.simple.retry.max-attempts=3
# DLQ para cuando se superan los intentos
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Le avisa a Swagger que la aplicación está detrás del proxy HTTPS de Render
server.forward-headers-strategy=framework