spring.application.name=servicio-consultas
server.port=${PORT:8080}

# MongoDB (modelo de lectura). En Render se configura MONGODB_URI con la cadena de conexión de Atlas.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/donatrack}
spring.data.mongodb.database=${MONGODB_DATABASE:donatrack}

# RabbitMQ: mismo broker que Logística. En Render se configuran las mismas variables que tiene Logística:
# SPRING_RABBITMQ_HOST, _PORT, _USERNAME, _PASSWORD y _VIRTUAL_HOST.
# Reintentos del consumidor: 3 intentos y después el mensaje va a la DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Detrás del proxy HTTPS de Render (y del gateway)
server.forward-headers-strategy=framework
